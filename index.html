<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Blood Bank Management System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login">

    <div class="login-page">
        <div class="login-box">
            <div class="login-logo">
                <div class="drop"><span>+</span></div>
                <h1>Blood Bank</h1>
                <p>Management System &ndash; Admin Login</p>
            </div>

            <div class="demo-credentials">
                <strong>Demo credentials</strong><br>
                Username: <code>admin</code> &nbsp;|&nbsp; Password: <code>admin123</code>
            </div>

            <div class="form-error-box" id="loginError">Invalid username or password.</div>

            <form id="loginForm" novalidate>
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" class="form-control" placeholder="Enter username" autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Enter password" autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary btn-block">Login</button>
            </form>

            <p class="login-note">
                Note: This login uses JavaScript for demonstration only and is
                <strong>not production-grade security</strong>. This is an academic
                frontend project, not a real medical system.
            </p>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="js/data.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
